# Render Blueprint —— 卡券货源导航站
# 部署方式：本项目推送到 GitHub 后，在 dashboard.render.com 选择 "New" → "Blueprint"
# 直接指向本仓库，Render 会按此文件自动创建 Web Service。
# 注意：NODE_VERSION 必须 ≥ 22（项目使用 Node 内置的 node:sqlite）。
services:
  - type: web
    name: kaquan-nav
    runtime: node
    plan: free
    # 区域可选：oregon(美西) / frankfurt(欧洲) / singapore(亚太，国内访问更友好，但免费档可能需切换)
    region: singapore
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_USER
        sync: false          # 部署后在 Render 后台设置
      - key: ADMIN_PASSWORD
        sync: false          # 部署后在 Render 后台设置（务必改成强密码）
      - key: BAIDU_PUSH_TOKEN
        value: "UqghpI0bMfAWnAW2"   # 百度站长平台「普通收录-API提交」接口 token（仅用于主动推送网址）
    # 免费档不支持持久磁盘（disks are not supported for free tier services）
    # 数据库/图标缓存在 /opt/render/project/src/data（随实例临时存在）
    # 注意：重新部署或休眠重启后数据会重置为种子数据（db.js 自动重建），站点/友链需重新录入
    # 如需数据持久化，升级 paid 档后再补回 disk 配置
