# Render Blueprint —— 卡券货源导航站
# 部署方式：本项目推送到 GitHub 后，在 dashboard.render.com 选择 "New" → "Blueprint"
# 直接指向本仓库，Render 会按此文件自动创建 Web Service。
# 注意：NODE_VERSION 必须 ≥ 22（项目使用 Node 内置的 node:sqlite）。
services:
  - type: web
    name: kaquan-nav
    runtime: node
    plan: free
    # 区域可选：oregon(美西) / frankfurt(欧洲) / singapore(亚太，国内访问更友好，但免费档可能需切换)
    region: singapore
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_USER
        sync: false          # 部署后在 Render 后台设置
      - key: ADMIN_PASSWORD
        sync: false          # 部署后在 Render 后台设置（务必改成强密码）
      - key: BAIDU_PUSH_TOKEN
        value: "UqghpI0bMfAWnAW2"   # 百度站长平台「普通收录-API提交」接口 token（仅用于主动推送网址）
      - key: GITHUB_PUSH_TOKEN
        sync: false          # 部署后在 Render 后台手动填写：具有 repo 权限的 GitHub PAT（用于把数据库同步回仓库实现跨部署持久化）
    # 免费档不支持持久磁盘；改用「数据库文件同步回 GitHub 仓库」实现跨部署持久化（src/persist.js）
    # 每次部署自动从仓库拉回最新数据，运行中每 60 秒及关停前自动 push 一次
    # 注意：GITHUB_PUSH_TOKEN 不要写死在本文件（会被 GitHub 密钥扫描拦截），请在 Render 后台环境变量里填
